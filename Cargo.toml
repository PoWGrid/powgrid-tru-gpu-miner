[package]
name = "powgrid-tru-gpu-miner"
version = "1.3.0"
edition = "2021"

[dependencies]
ctrlc = "3.4"
hex = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ureq = { version = "2.9", features = ["json"] }
libc = "0.2"
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3.34"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
